<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      background: url("../images/hero.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
      background: #06071b;
    }
    main { flex: 1; }

    .bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      /* ❌ filter সরানো হয়েছে — GPU লোড কমাতে */
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;   /* ⬅️ fade একটু বাড়ানো */
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: opacity;
    }

    .bg-video.active { opacity: 1; }

    .video-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: -1;
      transform: translateZ(0);
      pointer-events: none;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
    }
    .navbar nav { display: flex; gap: 29px; }
    .navbar a { text-decoration: none; color: white; }
    .navbar a:hover { color: cyan; }
    .logo {
      background: linear-gradient(90deg, #a855f7, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hero {
      min-height: 35vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: start;
      padding: 30px 20px;
      box-sizing: border-box;
      font-family: Georgia, 'Times New Roman', Times, serifor;
    }
    .hero-content { max-width: 700px; }
    span { color: hwb(286 33% 9%); }
    .btn {
      display: inline-block;
      color: #eee;
      background: linear-gradient(hwb(284 40% 8%), hwb(296 69% 3%));
      padding: 10px 15px;
      border-radius: 30px;
      border: 2px solid hwb(248 0% 79%);
      text-decoration: none;
      transition: transform .2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .footer {
      text-align: center;
      padding: 70px 10px;
      margin-top: auto;
    }
  </style>
</head>

    function drawFrame() {
      if (primary.readyState >= 2) {
        ctx.globalAlpha = 1;
        ctx.drawImage(primary, 0, 0, canvas.width, canvas.height);
      }
      if (primary.duration && primary.duration - primary.currentTime <= 0.85) {
        if (!fading) { fading = true; standby.currentTime = 0; standby.play().catch(()=>{}); }
        const p = Math.min(1, Math.max(0, (0.85 - (primary.duration - primary.currentTime)) / 0.85));

        if (standby.readyState >= 2) {
          ctx.globalAlpha = alpha;
          ctx.drawImage(standby, 0, 0, canvas.width, canvas.height);
        }
        if (p >= 0.99) {
          const tmp = primary; primary = standby; standby = tmp; fading = false;
          standby.pause(); standby.currentTime = 0;
        }
      }
      requestAnimationFrame(drawFrame);
    }
